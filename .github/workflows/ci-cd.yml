name: CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Linters (HTMLHint y ESLint)
        run: npm install -g htmlhint eslint

      - name: Linter 1 - HTMLHint
        run: htmlhint index.html

      - name: Linter 2 - ESLint (API)
        # Se requiere un archivo de configuración (ej. eslint.config.js) en la raíz
        run: eslint api/app.js

      - name: Linter 3 - Hadolint (Dockerfiles)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "api/Dockerfile"
          config: ".hadolint.yaml"

      - name: Armar carpeta del sitio (_site)
        run: |
          mkdir _site
          cp index.html estilos.css libro-de-visitas.js _site/

      - name: Subir artefacto a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Armar carpeta del sitio (_site)
        run: |
          mkdir _site
          cp index.html estilos.css libro-de-visitas.js _site/

      - name: Correr pruebas de Vitest
        run: npm test

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para perfil-api
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/perfil-api
          tags: type=sha,prefix=sha-

      - name: Construir y subir perfil-api
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Extraer metadatos para perfil-web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/perfil-web
          tags: type=sha,prefix=sha-

      - name: Construir y subir perfil-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  security:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Escanear imagen perfil-api con Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/perfil-api:sha-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Escanear imagen perfil-web con Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/perfil-web:sha-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  smoke:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pendiente"

  deploy-prod:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - run: echo "Pendiente"