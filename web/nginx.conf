server {
    # Puerto 8080 porque los usuarios no root no pueden usar el 80 (Reto 3)
    listen 8080;
    
    # 1. Servir los archivos estáticos de tu perfil
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 2. Redirigir el tráfico de la API al contenedor Node.js
    location /api/ {
        proxy_pass http://api:3000/api/;
    }
}